<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="section">

  <h2>Admin Login</h2>

  <form id="loginForm">

    <input
      type="text"
      id="username"
      placeholder="Username"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

</section>

<script src="admin.js"></script>

</body>
</html>
