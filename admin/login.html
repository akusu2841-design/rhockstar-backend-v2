<!DOCTYPE html>
<html>
<head>
  <title>Admin Orders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 style="text-align:center;">All Orders</h2>

<div id="orders"></div>

<script>
function loadOrders() {
  fetch("https://rhockstar-nation-1.onrender.com")
    .then(res => res.json())
    .then(data => {

      const container = document.getElementById("orders");
      container.innerHTML = "";

      data.reverse().forEach(o => {
        container.innerHTML += `
          <div class="card">
            <h3>${o.service}</h3>
            <p><b>Name:</b> ${o.name}</p>
            <p><b>Phone:</b> ${o.phone}</p>
            <p><b>Price:</b> ₦${o.price}</p>
            <p><b>Details:</b> ${o.details}</p>
            <small>${o.date}</small>
          </div>
        `;
      });

    });
}

loadOrders();
setInterval(loadOrders, 5000);
</script>

</body>
</html>
