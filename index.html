<!-- DASHBOARD -->
<section id="dashboard" class="page">

<div class="card">

<h2>Create Order</h2>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="serviceInput" readonly>
<input id="priceInput" readonly>

<textarea id="desc" placeholder="Project details"></textarea>

<label>Payment Option</label>

<select id="paymentType" onchange="updatePaymentAmount()">
  <option value="Full Payment">Full Payment</option>
  <option value="50% Deposit">50% Deposit</option>
</select>

<button onclick="createOrder()">Place Order</button>

</div>

<div class="card">
<h3>My Orders</h3>
<div id="myOrders"></div>
</div>

</section>
