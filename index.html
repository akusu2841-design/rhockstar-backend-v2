<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhockstar Nation</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>

<div id="overlay" onclick="toggleMenu()"></div>

<header class="top">
<img src="images/logo.jpg">
<h2>Rhockstar Nation</h2>
<p>Orders • Dashboard • Automation</p>
</header>

<!-- HAMBURGER -->
<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<!-- NAV DRAWER -->
<nav id="navMenu">
<button onclick="show('home'); toggleMenu()">Home</button>
<button onclick="show('services'); toggleMenu()">Services</button>
<button onclick="show('dashboard'); toggleMenu()">Dashboard</button>
<button id="adminBtn" onclick="show('admin'); toggleMenu()" style="display:none;">Admin</button>
</nav>

<!-- HOME -->
<section id="home" class="page active">
<div class="card">
<h2>Login / Register</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>
</section>

<!-- SERVICES -->
<section id="services" class="page">
<h2 class="title">Services</h2>

<div class="grid">
<div class="card" onclick="selectService('Starter Website',150000)">
<h3>Web Development</h3>
<p>Starter Website ₦150,000+</p>
</div>

<div class="card" onclick="selectService('Logo Design',10000)">
<h3>Design</h3>
<p>From ₦10,000</p>
</div>

<div class="card" onclick="selectService('WhatsApp Ad',5000)">
<h3>Marketing</h3>
<p>From ₦5,000</p>
</div>

<div class="card" onclick="selectService('Business System',100000)">
<h3>Business Tools</h3>
<p>Automation systems</p>
</div>
</div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="page">

<div class="card">
<h2>Create Order</h2>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="serviceInput" readonly>
<input id="priceInput" readonly>
<textarea id="desc" placeholder="Project details"></textarea>

<button onclick="createOrder()">Place Order</button>
</div>

<div class="card">
<h3>My Orders</h3>
<div id="myOrders"></div>
</div>

</section>

<!-- ADMIN -->
<section id="admin" class="page">
<h2>Admin Panel</h2>
<div id="allOrders"></div>
</section>

<a class="wa" href="https://wa.me/2348074647269">WhatsApp</a>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
