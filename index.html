<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhockstar Nation</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>Rhockstar Nation</h1>
  <p>Web Development • Design • Marketing • Business Systems</p>

  <button class="menuBtn" onclick="toggleMenu()">☰ Menu</button>
</header>

<nav id="navMenu" class="nav">
  <a onclick="show('home')">Home</a>
  <a onclick="show('services')">Services</a>
  <a onclick="show('dashboard')">Dashboard</a>
  <a onclick="show('admin')">Admin</a>
</nav>

<div id="overlay"></div>

<!-- HOME -->
<section id="home" class="page active">
  <div class="card">
    <h2>Welcome</h2>
    <p>Build your digital presence with us.</p>
    <button class="btn" onclick="show('services')">Explore Services</button>
  </div>
</section>

<!-- SERVICES -->
<section id="services" class="page">
  <h2 class="title">Services</h2>

  <div class="grid">

    <div class="service" onclick="selectService('Website Development', 50000, 'web')">
      <h3>Web Development</h3>
    </div>

    <div class="service" onclick="selectService('Design', 10000, 'design')">
      <h3>Design</h3>
    </div>

    <div class="service" onclick="selectService('Marketing', 20000, 'marketing')">
      <h3>Marketing</h3>
    </div>

    <div class="service" onclick="selectService('Business System', 80000, 'business')">
      <h3>Business Systems</h3>
    </div>

  </div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="page">
  <h2>Order Form</h2>

  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Phone">

  <input id="serviceInput" readonly>
  <input id="priceInput" readonly>

  <select id="paymentType" onchange="updatePaymentAmount()">
    <option>Full Payment</option>
    <option>50% Deposit</option>
  </select>

  <textarea id="desc" placeholder="Description"></textarea>

  <button class="btn" onclick="createOrder()">Submit</button>
</section>

<!-- ADMIN -->
<section id="admin" class="page">
  <h2>Admin Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="btn" onclick="adminLogin()">Login</button>

  <div id="allOrders"></div>
</section>

<a class="whatsapp" href="https://wa.me/YOURNUMBER">WhatsApp</a>

<script src="script.js" defer></script>
</body>
</html>
