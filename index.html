<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rhockstar Nation</title>

<link rel="stylesheet" href="style.css">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>

<img src="images/logo.jpg" width="200">

<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('services')">Services</button>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('admin')">Admin</button>
</nav>

<!-- HOME -->
<div id="home" class="page active">
<h1>Rhockstar Nation</h1>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- SERVICES -->
<div id="services" class="page">
<div class="card">
<h2>Services</h2>

<div class="card" onclick="selectService('Logo Design',10000)">
Logo Design ₦10,000
</div>

<div class="card" onclick="selectService('Graphics Design',15000)">
Graphics Design ₦15,000
</div>

<div class="card" onclick="selectService('Web Development',150000)">
Web Development ₦150,000+
</div>

</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page">

<div class="card">
<h2>Create Order</h2>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">

<input id="serviceInput" readonly>
<input id="priceInput" readonly>

<textarea id="desc" placeholder="Project details"></textarea>

<button onclick="createOrder()">Create Order</button>
</div>

<div class="card">
<h3>My Orders</h3>
<div id="myOrders"></div>
</div>

</div>

<!-- ADMIN -->
<div id="admin" class="page">
<h2>Admin Panel</h2>
<div id="allOrders"></div>
</div>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
