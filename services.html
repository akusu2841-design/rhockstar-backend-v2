<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services - Rhockstar Nation</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">
    <img src="images/logo.jpg" alt="logo">
    <h2>Rhockstar Nation</h2>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="news.html">News</a>
  </nav>
</header>

<section class="section">
  <h2>Our Services & Pricing</h2>
</section>

<!-- SERVICES -->
<section class="section">

  <div class="grid">

    <div class="card" data-service="Starter Website" data-price="150000">
      <h3>Starter Website</h3>
      <p>Basic business website</p>
      <b>₦150,000</b>
      <button class="order-btn">Order</button>
    </div>

    <div class="card" data-service="Business Website" data-price="300000">
      <h3>Business Website</h3>
      <p>Professional website</p>
      <b>₦300,000</b>
      <button class="order-btn">Order</button>
    </div>

    <div class="card" data-service="E-Commerce Website" data-price="450000">
      <h3>E-Commerce Website</h3>
      <b>₦450,000</b>
      <button class="order-btn">Order</button>
    </div>

    <div class="card" data-service="Logo Design" data-price="10000">
      <h3>Logo Design</h3>
      <b>₦10,000</b>
      <button class="order-btn">Order</button>
    </div>

  </div>
</section>

<!-- MODAL -->
<div id="orderModal" class="modal">

  <div class="modal-content">

    <h2>Place Order</h2>

    <input id="m_service" disabled>
    <input id="m_price" disabled>

    <input id="m_name" placeholder="Full Name">
    <input id="m_phone" placeholder="Phone Number">
    <textarea id="m_details" placeholder="Project Details"></textarea>

    <button onclick="submitOrder()">Submit Order</button>
    <button onclick="closeModal()">Close</button>

  </div>
</div>

<script src="app.js"></script>
</body>
    </html>
